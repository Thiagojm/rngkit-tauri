[package]
name = "rngkit"
version = "0.1.0"
description = "Windows-first RngKit desktop application"
authors = ["Thiagojm <tjm.plastica@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "rngkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rngkit-core = { git = "https://github.com/Thiagojm/rngkit-core", rev = "7c798146eddbcb9443c84adc236c0f7c09bd7789" }
rngkit-sources = { git = "https://github.com/Thiagojm/rngkit-core", rev = "7c798146eddbcb9443c84adc236c0f7c09bd7789" }
rngkit-analysis = { git = "https://github.com/Thiagojm/rngkit-core", rev = "7c798146eddbcb9443c84adc236c0f7c09bd7789" }
rngkit-recording = { git = "https://github.com/Thiagojm/rngkit-core", rev = "7c798146eddbcb9443c84adc236c0f7c09bd7789" }
rngkit-engine = { git = "https://github.com/Thiagojm/rngkit-core", rev = "7c798146eddbcb9443c84adc236c0f7c09bd7789" }
rngkit-xlsx = { git = "https://github.com/Thiagojm/rngkit-core", rev = "7c798146eddbcb9443c84adc236c0f7c09bd7789" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"
