[package]
name = "rngkit"
version = "0.1.0"
description = "Windows-first RngKit desktop application"
authors = ["Thiagojm <tjm.plastica@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "rngkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rngkit-core = { git = "https://github.com/Thiagojm/rngkit-core", rev = "3f327e9e88679c26683323f116cd6d7b3ea64fff" }
rngkit-sources = { git = "https://github.com/Thiagojm/rngkit-core", rev = "3f327e9e88679c26683323f116cd6d7b3ea64fff" }
rngkit-analysis = { git = "https://github.com/Thiagojm/rngkit-core", rev = "3f327e9e88679c26683323f116cd6d7b3ea64fff" }
rngkit-recording = { git = "https://github.com/Thiagojm/rngkit-core", rev = "3f327e9e88679c26683323f116cd6d7b3ea64fff" }
rngkit-engine = { git = "https://github.com/Thiagojm/rngkit-core", rev = "3f327e9e88679c26683323f116cd6d7b3ea64fff" }
rngkit-xlsx = { git = "https://github.com/Thiagojm/rngkit-core", rev = "3f327e9e88679c26683323f116cd6d7b3ea64fff" }
