# Installer packaging only. This is not CI.
# Push/PR to main still uses ci.yml (`--no-bundle`) and never builds installers.
# Tags `v*` (example: v0.1.0) validate version + exact-SHA CI, then build NSIS
# + .deb and open a GitHub Release draft.
# workflow_dispatch from a branch validates internal versions and the same SHA
# CI barrier, then builds Actions artifacts without publishing.
# Semver prerelease versions (0.1.0-rc.1) mark the draft as prerelease; stable
# versions do not. Ubuntu packaging is not Linux desktop hardware acceptance.
# The .deb does not install udev rules or run the device-setup helper.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version and CI
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate-version.outputs.version }}
      prerelease: ${{ steps.validate-version.outputs.prerelease }}

    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6

      - name: Validate versions
        id: validate-version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            python3 scripts/release/validate-version.py --tag "$RELEASE_REF_NAME"
          else
            python3 scripts/release/validate-version.py
          fi

      - name: Require CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release/require-ci.py \
            --sha "${{ github.sha }}" \
            --repo "${{ github.repository }}"

  package:
    name: ${{ matrix.os }} ${{ matrix.bundle }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-22.04
            bundle: deb

    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Ubuntu Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libudev-dev \
            libusb-1.0-0-dev

      - run: npm ci

      - name: Build installer
        run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked

      - name: Stage installer
        shell: bash
        run: |
          mkdir -p dist-artifacts
          if [ "${{ matrix.bundle }}" = "nsis" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe dist-artifacts/
          else
            cp src-tauri/target/release/bundle/deb/*.deb dist-artifacts/
          fi
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.bundle }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    name: Draft GitHub Release
    needs: [verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RngKit ${{ github.ref_name }}
          draft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
          body: |
            Unsigned installers for this tag. Inspect the attached files, then
            publish this draft manually. Signing, updater, Store, and SmartScreen
            remain out of scope.

            - **Windows:** per-user NSIS setup. Windows may warn because the
              package is unsigned.
            - **Linux:** amd64 `.deb` built on Ubuntu 22.04. This package is not
              Linux hardware acceptance. It does not install udev rules or run
              the device-setup helper; use Help → Choosing a source after install.

            Install the `.deb` with `sudo apt install ./<file>.deb`.
